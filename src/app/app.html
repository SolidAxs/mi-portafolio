<nav class="navbar glass" [class.navbar--scrolled]="scrolled()">
  <div class="navbar__container">

    <!-- Logo { 💼 } -->
    <a class="navbar__logo" routerLink="/" (click)="closeMenu()" aria-label="Ir al inicio — SolidAxs">
      <div class="navbar__logo-emblem">
        <svg viewBox="0 0 64 64" width="30" height="30" fill="none" class="navbar__logo-svg" aria-hidden="true">
          <defs>
            <linearGradient id="navLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#41BBD9" />
              <stop offset="100%" stop-color="#006E90" />
            </linearGradient>
            <linearGradient id="navCaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#053445" />
              <stop offset="100%" stop-color="#011b24" />
            </linearGradient>
          </defs>
          <!-- { -->
          <path d="M 14 14 C 9 14, 8 21, 8 26 C 8 30, 4.5 32, 2.5 32 C 4.5 32, 8 34, 8 38 C 8 43, 9 50, 14 50" stroke="url(#navLogoGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Handle -->
          <path d="M 27 22 V 18 C 27 16.5, 28.5 15, 30 15 H 34 C 35.5 15, 37 16.5, 37 18 V 22" stroke="#41BBD9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Case -->
          <rect x="18" y="22" width="28" height="23" rx="3.5" fill="url(#navCaseGrad)" stroke="#41BBD9" stroke-width="2" />
          <!-- Flap -->
          <path d="M 18 24 L 32 33 L 46 24" stroke="#41BBD9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Lock -->
          <rect x="30" y="31" width="4" height="4.5" rx="1" fill="#F18F01" stroke="#ffb347" stroke-width="0.8" />
          <!-- } -->
          <path d="M 50 14 C 55 14, 56 21, 56 26 C 56 30, 59.5 32, 61.5 32 C 59.5 32, 56 34, 56 38 C 56 43, 55 50, 50 50" stroke="url(#navLogoGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <span class="gradient-text navbar__logo-text">SolidAxs</span>
    </a>

    <!-- Links desktop -->
    <ul class="navbar__links" role="list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            class="navbar__link"
            [routerLink]="link.path"
            routerLinkActive="navbar__link--active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- CTA Desktop -->
    <a class="navbar__cta" routerLink="/contact">
      Hablemos
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 14 0M12 5l7 7-7 7"/>
      </svg>
    </a>

    <!-- Hamburger mobile -->
    <button
      class="navbar__hamburger"
      [class.navbar__hamburger--open]="menuOpen()"
      (click)="toggleMenu()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="menuOpen()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Mobile menu overlay -->
  @if (menuOpen()) {
    <div class="navbar__mobile-menu anim-fade-in">
      <ul role="list">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              class="navbar__mobile-link"
              [routerLink]="link.path"
              routerLinkActive="navbar__mobile-link--active"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMenu()"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a class="navbar__cta navbar__cta--mobile" routerLink="/contact" (click)="closeMenu()">
        Hablemos
      </a>
    </div>
  }
</nav>

<!-- Contenido principal -->
<main class="main-content">
  <router-outlet />
</main>

<!-- Footer -->
<footer class="footer">
  <div class="container footer__inner">
    <p class="footer__text">
      Diseñado y desarrollado por
      <span class="gradient-text">SolidAxs</span>
      &mdash; {{ currentYear }}
    </p>
    <ul class="footer__socials" role="list">
      <li>

            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>

  </div>
</footer>
