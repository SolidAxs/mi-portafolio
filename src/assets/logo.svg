<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41BBD9" />
      <stop offset="100%" stop-color="#006E90" />
    </linearGradient>
    <linearGradient id="caseBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053445" />
      <stop offset="100%" stop-color="#011b24" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#41BBD9" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Llave izquierda { -->
  <path
    d="M 14 14 C 9 14, 8 21, 8 26 C 8 30, 4.5 32, 2.5 32 C 4.5 32, 8 34, 8 38 C 8 43, 9 50, 14 50"
    stroke="url(#logoCyanGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoGlow)"
  />

  <!-- Asa del portafolio -->
  <path
    d="M 27 22 V 18 C 27 16.5, 28.5 15, 30 15 H 34 C 35.5 15, 37 16.5, 37 18 V 22"
    stroke="#41BBD9"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Cuerpo del portafolio -->
  <rect
    x="18"
    y="22"
    width="28"
    height="23"
    rx="3.5"
    fill="url(#caseBodyGrad)"
    stroke="#41BBD9"
    stroke-width="2"
  />

  <!-- Tapa / Solapa en V del portafolio -->
  <path
    d="M 18 24 L 32 33 L 46 24"
    stroke="#41BBD9"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Broche central en ámbar vibrante -->
  <rect
    x="30"
    y="31"
    width="4"
    height="4.5"
    rx="1"
    fill="#F18F01"
    stroke="#ffb347"
    stroke-width="0.8"
  />

  <!-- Detalles de costura/líneas laterales sutiles -->
  <line x1="24" y1="27" x2="24" y2="41" stroke="rgba(173, 202, 214, 0.35)" stroke-width="1" stroke-dasharray="2 1.5" />
  <line x1="40" y1="27" x2="40" y2="41" stroke="rgba(173, 202, 214, 0.35)" stroke-width="1" stroke-dasharray="2 1.5" />

  <!-- Llave derecha } -->
  <path
    d="M 50 14 C 55 14, 56 21, 56 26 C 56 30, 59.5 32, 61.5 32 C 59.5 32, 56 34, 56 38 C 56 43, 55 50, 50 50"
    stroke="url(#logoCyanGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#logoGlow)"
  />
</svg>
